name: NETO Android APK

on:
  push:
    branches:
      - main
      - android-agent-upgrade
    paths:
      - "android/**"
      - "src/lib/androidControl.ts"
      - ".github/workflows/android-apk.yml"

  pull_request:
    paths:
      - "android/**"
      - "src/lib/androidControl.ts"
      - ".github/workflows/android-apk.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile checks
        working-directory: android
        run: gradle test lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/NETO-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neto-android-apk
          path: android/app/build/outputs/apk/debug/NETO-debug.apk
          if-no-files-found: error

  emulator-smoke-test:
    name: Android Emulator Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: neto-android-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -e

            adb install -r apk/NETO-debug.apk

            adb shell am start \
              -n com.neto.assistant/.MainActivity

            sleep 8

            adb shell pidof com.neto.assistant

            adb shell dumpsys package com.neto.assistant \
              | grep -q "com.neto.assistant"

            adb shell settings put secure enabled_accessibility_services \
              com.neto.assistant/.NetoAccessibilityService

            adb shell settings put secure accessibility_enabled 1

            sleep 3

            adb shell dumpsys accessibility \
              | grep -q "com.neto.assistant"

            adb shell am force-stop com.neto.assistant

            adb shell monkey \
              -p com.neto.assistant \
              1

            sleep 5

            adb shell pidof com.neto.assistant
